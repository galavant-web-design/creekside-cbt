<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Share card source</title>
  <!--
    Source for images/share-card.jpg (the 1200x630 link-preview image).
    To regenerate after changing the photo or text, run from the repo root:
      tools/render-share-card.sh
  -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .card {
      position: relative;
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
      background:
        linear-gradient(to top, rgb(20 48 42 / 0.92), rgb(20 48 42 / 0.5) 55%, rgb(20 48 42 / 0.15)),
        url("../images/flatirons-hero.jpg") center 40% / cover;
      font-family: "Work Sans", system-ui, sans-serif;
    }
    .brand {
      position: absolute;
      top: 64px;
      left: 80px;
      display: flex;
      align-items: center;
      gap: 18px;
      font: 600 30px/1 "Lora", Georgia, serif;
      text-shadow: 0 1px 10px rgb(20 48 42 / 0.6);
    }
    .brand img { width: 60px; height: 60px; }
    .eyebrow {
      margin: 0 0 18px;
      color: #f6f1e7;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 26px;
      font: 600 84px/1.05 "Lora", Georgia, serif;
    }
    h1 em { font-weight: 500; }
    .rule { width: 96px; height: 5px; margin-bottom: 26px; border-radius: 3px; background: #d9a441; }
    .tagline { margin: 0; font-size: 28px; font-weight: 500; color: #f6f1e7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../favicon.svg" alt=""> Creekside CBT</div>
    <p class="eyebrow">Psychologist · Researcher · Therapist</p>
    <h1>Jessica F. Magidson, <em>PhD</em></h1>
    <div class="rule"></div>
    <p class="tagline">Outdoor cognitive behavioral therapy in Boulder, Colorado</p>
  </div>
</body>
</html>
